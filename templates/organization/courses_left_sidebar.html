<nav class="course-directory-tabs" aria-label="{{ _('Courses') }}">
  {% if request.user.is_authenticated %}
    <a href="{{ url('organization_courses', organization.id, organization.slug) }}?tab=my"{% if current_tab == 'my' %} class="active" aria-current="page"{% endif %}>{{ _('My Courses') }}</a>
    <a href="{{ url('organization_courses', organization.id, organization.slug) }}?tab=joinable"{% if current_tab == 'joinable' %} class="active" aria-current="page"{% endif %}>{{ _('Join Courses') }}</a>
  {% else %}
    <a href="{{ url('organization_courses', organization.id, organization.slug) }}?tab=joinable" class="active" aria-current="page">{{ _('Available Courses') }}</a>
  {% endif %}
</nav>
