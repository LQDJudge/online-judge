<div class="sidebox organization-search-box">
  <div class="sidebox-content">
    <form id="filter-form" method="GET">
      <p class="organization-search-control">
        <input id="search-organization" type="text" name="organization" value="{{ organization_query or '' }}"
               placeholder="{{ _('Search groups...') }}">
        <button id="go" type="submit" class="organization-search-submit"
                title="{{ _('Search') }}" aria-label="{{ _('Search') }}">
          <i class="fa fa-search" aria-hidden="true"></i>
        </button>
      </p>
      <div class="organization-sort-control">
        <label for="order" class="bold-text margin-label">{{ _('Order by') }}</label>
        <select id="order" name="order">
          {% for value, name in all_sort_options %}
            <option value="{{value}}"{% if selected_order == value%} selected{% endif %}>
              {{ name }}
            </option>
          {% endfor %}
        </select>
      </div>
      <div class="organization-create-row">
        <a class="organization-create-link" href="{{ url('organization_add') }}">
          <i class="fa fa-plus-circle" aria-hidden="true"></i>
          <span>{{ _('Create group') }}</span>
        </a>
      </div>
    </form>
  </div>
</div>
