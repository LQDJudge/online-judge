<dialog id="school-departure-dialog" class="school-departure-dialog" aria-labelledby="school-departure-title" aria-describedby="school-departure-description">
  <h2 id="school-departure-title"></h2>
  <p class="school-departure-name">{{ organization.name }}</p>
  <p id="school-departure-description"></p>
  <p class="school-departure-note">{{ _('Separate course enrollment and administrator roles remain unchanged.') }}</p>
  <div class="school-departure-actions">
