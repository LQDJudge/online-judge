<dialog id="review-save-dialog" class="review-dialog" aria-labelledby="review-save-heading">
  <div class="review-dialog-heading">
    <h3 id="review-save-heading">{{ _('Save and cancel reviews?') }}</h3>
    <button type="button" class="review-text-button" data-save-close aria-label="{{ _('Close') }}">×</button>
  </div>
  <p data-save-message></p>
  <div class="review-dialog-actions">
    <button type="button" class="action-btn" data-save-confirm>{{ _('Save changes') }}</button>
  </div>
</dialog>
