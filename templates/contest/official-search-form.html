<div class="sidebox official-contest-search-box{% if selected_categories or selected_locations or year_from or year_to or selected_order %} filters-open{% endif %}">
  <h3 class="colored-text"><i class="fa fa-search" aria-hidden="true"></i>{{ _('Search') }}</h3>
  <div class="sidebox-content">
    <form id="filter-form" method="GET">
      <div>
        <label class="sr-only" for="search-contest">{{ _('Search') }}</label>
        <input id="search-contest" type="text" name="contest" value="{{ contest_query or '' }}"
               placeholder="{{ _('Search contests...') }}">
      </div>

      <button type="button" class="official-filter-toggle"
              aria-controls="official-advanced-filters"
              aria-expanded="{{ 'true' if selected_categories or selected_locations or year_from or year_to or selected_order else 'false' }}">
        <i class="fa fa-sliders-h" aria-hidden="true"></i>
        <span>{{ _('Filters') }}</span>
        <i class="fa fa-chevron-down official-filter-chevron" aria-hidden="true"></i>
      </button>

      <div id="official-advanced-filters" class="official-advanced-filters">
        <div class="filter-form-group">
          <span class="bold-text margin-label">{{ _('Year') }}</span>
          <div class="year-range">
            <label class="sr-only" for="year_from">{{ _('From') }}</label>
            <input type="number" name="year_from" id="year_from" value="{{ year_from or '' }}"
                   placeholder="{{ _('From') }}">
            <label class="sr-only" for="year_to">{{ _('To') }}</label>
            <input type="number" name="year_to" id="year_to" value="{{ year_to or '' }}"
                   placeholder="{{ _('To') }}">
          </div>
        </div>

        <div class="filter-form-group">
          <label class="bold-text margin-label" for="category">{{ _('Category') }}</label>
          <select id="category" name="category" multiple>
            {% for cat in categories %}
              <option value="{{ cat.id }}"{% if cat.id in selected_categories %} selected{% endif %}>
                {{ cat.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="filter-form-group">
          <label class="bold-text margin-label" for="location">{{ _('Location') }}</label>
          <select id="location" name="location" multiple>
            {% for loc in locations %}
              <option value="{{ loc.id }}"{% if loc.id in selected_locations %} selected{% endif %}>
                {{ loc.name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="filter-form-group">
          <label for="order" class="bold-text margin-label">{{ _('Order by') }}</label>
          <select id="order" name="order">
            <option value="">---</option>
            {% for value, name in all_sort_options %}
              <option value="{{value}}"{% if selected_order == value%} selected{% endif %}>
                {{ name }}
              </option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="form-submit-group">
        <button id="go" type="submit" class="action-btn">{{ _('Apply') }}</button>
      </div>
    </form>
  </div>
</div>
